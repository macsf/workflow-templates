name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
  # Called by deploy.yml so a deploy only goes out after this passes.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: {{PNPM_VERSION}}

      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm run --if-present test

      - run: pnpm build
