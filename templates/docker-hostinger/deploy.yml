name: Deploy (Hostinger)

# Push to main deploys when any commit in the push has a subject starting with
# "release:" or "fix:" / "fix(scope):" and none contains "[skip deploy]".
# See .github/scripts/deploy-gate.sh. CI must pass first.
# workflow_dispatch skips the subject check, still runs CI, and only works from main.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "server/**"
      - "lib/**"
      - "components/**"
      - "prisma/**"
      - "public/**"
      - "docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.*"
      - "vite.config.*"
      - "tsconfig*.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/deploy-gate.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: {{PROJECT_NAME}}-prod
  # Queue behind a running deploy instead of killing it mid-update.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  skip-check:
    runs-on: ubuntu-latest
    outputs:
      skip_deploy: ${{ steps.out.outputs.skip_deploy }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys only run from main (got $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-gate.sh >> "$GITHUB_OUTPUT"

  validate:
    needs: skip-check
    if: needs.skip-check.outputs.skip_deploy != 'true'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: [skip-check, validate]
    if: >-
      ${{ !cancelled()
      && needs.skip-check.result == 'success'
      && needs.skip-check.outputs.skip_deploy != 'true'
      && needs.validate.result == 'success' }}
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: deploy
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image ref (GHCR requires lowercase)
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_tag=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}

  deploy:
    name: Deploy to Hostinger VPS
    needs: [build-and-push]
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: deploy

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Compose stack
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          # Hostinger rejects project names shorter than 3 characters.
          project-name: {{PROJECT_NAME}}
          docker-compose-path: docker-compose.yml
          environment-variables: |
            APP_IMAGE=${{ needs.build-and-push.outputs.image_tag }}
            NODE_ENV=production
            PORT=${{ vars.PORT || 8080 }}
            HOST_UID=${{ vars.HOST_UID || 0 }}
            HOST_GID=${{ vars.HOST_GID || 0 }}
            TRAEFIK_ENABLE=true
            TRAEFIK_HOST=${{ vars.TRAEFIK_HOST }}
            TRAEFIK_ROUTER=${{ vars.TRAEFIK_ROUTER || '{{PROJECT_NAME}}' }}
            TRAEFIK_ENTRYPOINT=${{ vars.TRAEFIK_ENTRYPOINT || 'websecure' }}
            TRAEFIK_CERTRESOLVER=${{ vars.TRAEFIK_CERTRESOLVER || 'letsencrypt' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=https://${{ vars.TRAEFIK_HOST }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            FRONTEND_URL=https://${{ vars.TRAEFIK_HOST }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }}
            ALLOWED_USERS=${{ secrets.ALLOWED_USERS }}
            ALLOWED_GOOGLE_DOMAIN=${{ vars.GOOGLE_WORKSPACE_DOMAIN }}
